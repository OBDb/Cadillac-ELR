generations:
  - name: "First Generation"
    start_year: 2014
    end_year: 2015
    description: "The Cadillac ELR was a luxury plug-in hybrid coupe based on the first-generation Chevrolet Volt's extended-range electric vehicle (EREV) platform. Featuring striking, angular design inspired by the Cadillac Converj concept car, it showcased Cadillac's Art & Science design language with dramatic proportions and distinctive vertical lighting elements. The powertrain combined a 1.4L four-cylinder gasoline engine with an electric motor and a 16.5 kWh lithium-ion battery, providing 37 miles of electric-only range before the gasoline generator engaged to extend range to about 340 miles total. The system produced 217 HP and 295 lb-ft of torque. The interior featured premium materials including leather, suede microfiber, chrome, and real wood accents, with Cadillac's CUE infotainment system as standard. The 2014 ELR had a base price of $75,000, but due to slow early sales, the 2015 model year was skipped. The ELR struggled in the market due to its high launch price and limited practicality with a tight rear seat."
  - name: "First Generation (2016 Facelift)"
    start_year: 2016
    end_year: 2016
    description: "The 2016 Cadillac ELR received a significant update with increased horsepower from 217 to 233 HP and peak torque from 295 to 373 lb-ft, reducing the zero-to-60 time by 1.5 seconds. The 2016 model featured enhanced suspension with stiffer springs, stiffer control-arm bushings, and a damper rebound spring to mitigate torque-steer. Brakes were upgraded with Brembo performance components available as an option. The all-electric range was improved from 37 to 39 miles with an updated 17.1 kWh lithium-ion battery. The 2016 ELR included previously optional safety features as standard: blind-spot monitoring, rear cross-traffic alert, automatic high beams, and lane-change alert. A new 4G LTE onboard connection with Wi-Fi hotspot capability was added, along with Cadillac's revised wreathless crest badge and revised front grille. The MSRP was reduced by $10,000 to approximately $65,000, but production ended in February 2016 after only one model year. The ELR represented Cadillac's first attempt at an electrified luxury vehicle, with total production of approximately 2,958 units sold across both generations (2,874 in the U.S., 84 in Canada)."
